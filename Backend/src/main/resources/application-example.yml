# ─────────────────────────────────────────────────────────────
# STOCKLIFE 백엔드 설정 예시
# 이 파일을 같은 폴더에 application.yml 로 복사한 뒤 값을 채워 쓰세요.
# application.yml 은 비밀값이 들어가므로 커밋하지 않습니다 (.gitignore 대상).
#
# ${환경변수:기본값} 형태는 환경변수(Backend/.env 참고)가 있으면 그 값을,
# 없으면 콜론 뒤 기본값을 씁니다.
# ─────────────────────────────────────────────────────────────
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/storeflow_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:<로컬 MySQL 비밀번호>}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      # 챗 첨부(영수증/문서) 업로드 한도. 서비스단 검증(ChatAttachmentService)의
      # MAX_DOCUMENT_BYTES(20MB)보다 여유 있게 잡아야 친절한 에러 메시지가 먼저 뜬다.
      max-file-size: 25MB
      max-request-size: 25MB

  jpa:
    hibernate:
      ddl-auto: none        # 스키마는 db/ 폴더의 SQL로 직접 관리
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  # 소비자 토큰 서명키. `openssl rand -base64 64` 등으로 만든 랜덤 문자열
  consumer-secret: "<랜덤 시크릿 키>"
  # 개발 편의상 길게 둔 값. 운영 배포 시에는 access 1~2시간 + refresh 재발급 구조로 줄일 것
  consumer-access-expiration: <access 토큰 유효시간(ms)>
  consumer-refresh-expiration: 3153600000000   # 100년 (ms) — 개발용

# Agent 서버(FastAPI) 주소. /api/chat 요청을 여기로 전달한다.
agent:
  base-url: http://localhost:8000

# Agent가 백엔드 내부 API(/internal/cart)를 호출할 때 쓰는 공유 비밀키.
# Agent/.env 의 INTERNAL_SERVICE_KEY 와 반드시 같은 값. 프론트에는 절대 노출 금지.
internal:
  service-key: "<랜덤 공유 키>"

# 네이버 클라우드 SENS 문자 발송 (값이 없으면 문자 기능만 동작하지 않음)
ncp:
  sms:
    access-key: ${NCP_SMS_ACCESS_KEY:}
    secret-key: ${NCP_SMS_SECRET_KEY:}
    service-id: ${NCP_SMS_SERVICE_ID:}
    from: ${NCP_SMS_FROM:}            # SENS에 등록한 발신 번호

  # 채팅 첨부파일 저장용 NCP Object Storage (S3 호환) — 비용 문제로 현재 비활성화
  # object-storage:
  #   enabled: false
  #   endpoint: https://kr.object.ncloudstorage.com
  #   region: kr-standard
  #   bucket: <버킷 이름>
  #   access-key: ${NCP_OS_ACCESS_KEY:}
  #   secret-key: ${NCP_OS_SECRET_KEY:}
