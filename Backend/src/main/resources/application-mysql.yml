spring:
  datasource:
    url: jdbc:mysql://localhost:3307/storeflow_db
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none   # schema.sql로 직접 관리
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

agent:
  base-url: http://localhost:8000   # Agent(FastAPI) 서버 주소 — 실제 배포 시 값 바뀌면 여기만 고치면 됨

jwt:
  consumer-secret: change-this-to-a-real-secret-key-before-deploy-please
  consumer-access-expiration: 1800000
  consumer-refresh-expiration: 1209600000

internal:
  service-key: change-this-to-a-real-shared-secret-before-deploy   # Backend <-> Agent만 아는 값. 프론트엔 절대 노출 금지