services:
  mysql:
    image: mysql:8.0
    container_name: storeflow_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: "storeflow_db"
    ports:
      - "3306:3306"
    volumes:
      - storeflow_mysql_data:/var/lib/mysql

volumes:
  storeflow_mysql_data:
